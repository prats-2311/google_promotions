openapi: 3.0.0
info:
  title: Tour Intelligence Data API
  description: >
    Deterministic, parameterized lookups against the tour_intelligence
    BigQuery dataset, plus the enthusiasm-scoring, city-ranking, and
    grounding-check SDK tools. Used in place of a native Data Store tool
    because these are exact-key structured lookups, not semantic search.
  version: "1.0.0"
servers:
  - url: https://tour-data-api-602700957663.us-central1.run.app

paths:
  /culture_notes:
    get:
      operationId: getCultureNotes
      summary: Cultural etiquette, greeting style, media behavior, and do/don't guidance for a city.
      parameters:
        - name: city_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Culture notes record for the city.
          content:
            application/json:
              schema:
                type: object
                properties:
                  city_id: { type: string }
                  etiquette_notes: { type: string }
                  greeting_style: { type: string }
                  media_behavior_notes: { type: string }
                  fan_interaction_style: { type: string }
                  dos: { type: array, items: { type: string } }
                  donts: { type: array, items: { type: string } }
                  humor_boundaries: { type: string }
        "404":
          description: No matching record for the given city_id.

  /live_culture_search:
    post:
      operationId: liveCultureSearch
      summary: >
        Fallback for a city with no culture_notes row. Calls Parallel's live
        Search API and synthesizes the results (Gemini, schema-constrained)
        into the same shape getCultureNotes returns, marked source=parallel_live
        with citations. Stays conservative/general when live results are thin
        rather than inventing specifics — must still pass checkGrounding
        before a brief treats it as canon, same as seeded-data output.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city_name]
              properties:
                city_name: { type: string }
                country: { type: string, nullable: true }
      responses:
        "200":
          description: Live-grounded culture guidance for the city.
          content:
            application/json:
              schema:
                type: object
                properties:
                  city_id: { type: string }
                  source: { type: string }
                  confidence: { type: string }
                  etiquette_notes: { type: string, nullable: true }
                  greeting_style: { type: string, nullable: true }
                  media_behavior_notes: { type: string, nullable: true }
                  fan_interaction_style: { type: string, nullable: true }
                  dos: { type: array, items: { type: string } }
                  donts: { type: array, items: { type: string } }
                  humor_boundaries: { type: string, nullable: true }
                  citations:
                    type: array
                    items:
                      type: object
                      properties:
                        url: { type: string }
                        title: { type: string, nullable: true }
        "500":
          description: Parallel Search or Gemini synthesis call failed.

  /city_demographics:
    get:
      operationId: getCityDemographics
      summary: >
        General, campaign/genre-independent city facts: literacy rate, median
        age, population, median household income, internet penetration,
        dominant social platforms, top entertainment interest categories, and
        notable public holidays. Distinct from getFanSignals, which is
        genre-scoped.
      parameters:
        - name: city_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: City demographics record for the city.
          content:
            application/json:
              schema:
                type: object
                properties:
                  city_id: { type: string }
                  literacy_rate: { type: number, nullable: true }
                  median_age: { type: number, nullable: true }
                  population: { type: integer, nullable: true }
                  median_household_income_usd: { type: number, nullable: true }
                  internet_penetration_rate: { type: number, nullable: true }
                  dominant_social_platforms: { type: array, items: { type: string } }
                  top_interest_categories: { type: array, items: { type: string } }
                  notable_public_holidays: { type: array, items: { type: string } }
        "404":
          description: No matching record for the given city_id.

  /live_city_demographics_search:
    post:
      operationId: liveCityDemographicsSearch
      summary: >
        Fallback for a city with no city_demographics row. Calls Parallel's
        live Search API and synthesizes the results (Gemini, schema-constrained)
        into the same shape getCityDemographics returns, marked
        source=parallel_live with citations. Numeric facts that disagree
        across sources are marked confidence=low rather than picked
        arbitrarily. Same per-turn execution budget caveat as
        liveCultureSearch — call directly from the orchestration driver, not
        chained inside a nested playbook frame.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city_name]
              properties:
                city_name: { type: string }
                country: { type: string, nullable: true }
      responses:
        "200":
          description: Live-grounded demographic data for the city.
          content:
            application/json:
              schema:
                type: object
                properties:
                  city_id: { type: string }
                  source: { type: string }
                  confidence: { type: string }
                  literacy_rate: { type: number, nullable: true }
                  median_age: { type: number, nullable: true }
                  population: { type: integer, nullable: true }
                  median_household_income_usd: { type: number, nullable: true }
                  internet_penetration_rate: { type: number, nullable: true }
                  dominant_social_platforms: { type: array, items: { type: string } }
                  top_interest_categories: { type: array, items: { type: string } }
                  notable_public_holidays: { type: array, items: { type: string } }
                  citations:
                    type: array
                    items:
                      type: object
                      properties:
                        url: { type: string }
                        title: { type: string, nullable: true }
        "500":
          description: Parallel Search or Gemini synthesis call failed.

  /campaign_strategy_chat:
    post:
      operationId: campaignStrategyChat
      summary: >
        Conversational pre-fill assistant for the New Campaign form. Not a
        Playbook tool used by any of the 5 MVP agents -- called directly by
        the dashboard BFF. Purely advisory: returns a suggested_campaign the
        user reviews and submits through the existing createCampaign path;
        this route never writes anything itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role: { type: string }
                      content: { type: string }
                strategy_text: { type: string, nullable: true }
      responses:
        "200":
          description: Assistant reply, plus a suggested campaign once enough information is gathered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply: { type: string }
                  ready: { type: boolean }
                  suggested_campaign:
                    type: object
                    nullable: true
                    properties:
                      title: { type: string }
                      campaign_type: { type: string }
                      genre: { type: string }
                      talent_roster: { type: array, items: { type: string } }
                      stops:
                        type: array
                        items:
                          type: object
                          properties:
                            city_id: { type: string }
                            stop_date: { type: string }
        "502":
          description: Gemini call failed.

  /fan_signals:
    get:
      operationId: getFanSignals
      summary: Enthusiasm score and strategic tier for a city, genre, and artist type.
      parameters:
        - name: city_id
          in: query
          required: true
          schema:
            type: string
        - name: genre
          in: query
          required: true
          schema:
            type: string
        - name: artist_type
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Fan signal record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  city_id: { type: string }
                  genre: { type: string }
                  artist_type: { type: string }
                  enthusiasm_score: { type: number }
                  fan_behavior_style: { type: string }
                  city_importance_tier: { type: string }
                  genre_affinity_notes: { type: string }
                  signal_basis: { type: string }
        "404":
          description: No matching record for the given city_id/genre/artist_type.

  /local_delight:
    get:
      operationId: getLocalDelight
      summary: Local-language phrases, cultural references, beloved icons, and crowd-moment suggestions for a city.
      parameters:
        - name: city_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Local delight record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  city_id: { type: string }
                  local_phrases:
                    type: array
                    items:
                      type: object
                      properties:
                        phrase: { type: string }
                        phonetic: { type: string }
                        meaning: { type: string }
                        usage_context: { type: string }
                  cultural_references: { type: array, items: { type: string } }
                  beloved_icons:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        domain: { type: string }
                        reference_note: { type: string }
                  crowd_moment_suggestions: { type: array, items: { type: string } }
                  music_or_remix_ideas: { type: array, items: { type: string } }
        "404":
          description: No matching record for the given city_id.

  /live_local_delight_search:
    post:
      operationId: liveLocalDelightSearch
      summary: >
        Fallback for a city with no local_delight row. Mirrors
        liveCultureSearch: calls Parallel's live Search API and synthesizes
        results (Gemini, schema-constrained) into the same shape
        getLocalDelight returns, marked source=parallel_live with citations.
        beloved_icons.name is always generic, never a named real person.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city_name]
              properties:
                city_name: { type: string }
                country: { type: string, nullable: true }
      responses:
        "200":
          description: Live-grounded local delight guidance for the city.
          content:
            application/json:
              schema:
                type: object
                properties:
                  city_id: { type: string }
                  source: { type: string }
                  confidence: { type: string }
                  local_phrases:
                    type: array
                    items:
                      type: object
                      properties:
                        phrase: { type: string }
                        phonetic: { type: string }
                        meaning: { type: string }
                        usage_context: { type: string }
                  cultural_references: { type: array, items: { type: string } }
                  beloved_icons:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        domain: { type: string }
                        reference_note: { type: string }
                  crowd_moment_suggestions: { type: array, items: { type: string } }
                  music_or_remix_ideas: { type: array, items: { type: string } }
                  citations:
                    type: array
                    items:
                      type: object
                      properties:
                        url: { type: string }
                        title: { type: string, nullable: true }
        "500":
          description: Parallel Search or Gemini synthesis call failed.

  /discover_venues:
    post:
      operationId: discoverVenues
      summary: >
        Venue discovery: instead of requiring the campaign creator to
        already have a specific venue URL in hand, runs a real Parallel
        Search for actual candidate venues (arenas, stadiums, theaters) in
        a city and returns a real, cited shortlist to pick from -- never a
        fabricated venue, only ones the search excerpts actually name.
        /extract_venue_info is the deep-dive once one is chosen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city_name]
              properties:
                city_name: { type: string }
                country: { type: string }
                capacity_hint: { type: string }
                format_hint: { type: string }
      responses:
        "200":
          description: A real, cited shortlist of candidate venues (possibly empty).
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: string }
                  venues:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        venue_type: { type: string }
                        approx_capacity: { type: string, nullable: true }
                        source_url: { type: string }
                        note: { type: string, nullable: true }
                  citations:
                    type: array
                    items:
                      type: object
                      properties:
                        url: { type: string }
                        title: { type: string, nullable: true }

  /extract_venue_info:
    post:
      operationId: extractVenueInfo
      summary: >
        Stop-specific logistics: real Parallel Extract against a specific
        venue/promoter URL the campaign creator provides (capacity, format,
        logistics notes -- distinct from getCultureNotes, which is
        city-level and never this granular), plus a second, real Parallel
        Search for the nearest major airport and nearest railway/train
        station for crew and talent commute planning. A failed commute
        search degrades to null commute fields rather than blocking the
        capacity extraction. Called directly from the orchestration driver,
        not through a conversational playbook turn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls, city_name]
              properties:
                urls: { type: array, items: { type: string } }
                city_name: { type: string }
                venue_name: { type: string }
                objective: { type: string }
      responses:
        "200":
          description: Grounded venue notes (possibly low-confidence if extraction turned up little).
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: string }
                  capacity: { type: string, nullable: true }
                  typical_event_format: { type: string, nullable: true }
                  logistics_notes: { type: string, nullable: true }
                  nearest_airport:
                    type: object
                    nullable: true
                    properties:
                      name: { type: string }
                      distance_or_travel_time: { type: string }
                  nearest_railway_station:
                    type: object
                    nullable: true
                    properties:
                      name: { type: string }
                      distance_or_travel_time: { type: string }
                  confidence: { type: string, enum: [high, medium, low] }
                  citations:
                    type: array
                    items:
                      type: object
                      properties:
                        url: { type: string }
                        title: { type: string, nullable: true }

  /cities_list:
    get:
      operationId: getCitiesList
      summary: >
        The full data-driven cities table (seeded + any bulk-added via
        /bulk_add_cities) -- the live replacement for the old hardcoded
        supported-city list, so a bulk-added city is immediately selectable
        everywhere city_id is validated.
      responses:
        "200":
          description: Every known city.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cities:
                    type: array
                    items:
                      type: object
                      properties:
                        city_id: { type: string }
                        city_name: { type: string }
                        country: { type: string, nullable: true }
                        primary_language: { type: string, nullable: true }
                        timezone: { type: string, nullable: true }
                        region: { type: string, nullable: true }

  /bulk_add_cities:
    post:
      operationId: bulkAddCities
      summary: >
        Real Parallel Task API batch research for many new cities at once,
        instead of N sequential live-search calls -- each city becomes a
        real cities table row with real, schema-constrained researched
        facts (region, country, primary_language, timezone), not a bare
        placeholder. Cities already present are skipped, not re-researched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city_names]
              properties:
                city_names: { type: array, items: { type: string } }
      responses:
        "200":
          description: Which cities were added vs. already existed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: { type: array, items: { type: string } }
                  skipped_existing: { type: array, items: { type: string } }

  /campaigns:
    get:
      operationId: getCampaign
      summary: Campaign-level metadata — genre, campaign type, and talent roster — needed by the Fan Enthusiasm Agent.
      parameters:
        - name: campaign_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Campaign record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign_id: { type: string }
                  title: { type: string }
                  campaign_type: { type: string }
                  genre: { type: string }
                  talent_roster: { type: array, items: { type: string } }
                  status: { type: string }
        "404":
          description: No matching record for the given campaign_id.
    post:
      operationId: createCampaign
      summary: Create a new campaign. Used by the dashboard's "New Campaign" flow — not currently called by any Playbook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaign_id, title, campaign_type, genre]
              properties:
                campaign_id: { type: string }
                title: { type: string }
                campaign_type: { type: string }
                genre: { type: string }
                talent_roster: { type: array, items: { type: string } }
                status: { type: string }
      responses:
        "200":
          description: Insert confirmation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign_id: { type: string }
                  status: { type: string }
        "500":
          description: Insert failed.

  /campaigns_list:
    get:
      operationId: listCampaigns
      summary: All campaigns, most recently created first. Used by the dashboard's campaign switcher — not currently called by any Playbook.
      responses:
        "200":
          description: All campaign records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    items:
                      type: object
                      properties:
                        campaign_id: { type: string }
                        title: { type: string }
                        campaign_type: { type: string }
                        genre: { type: string }
                        talent_roster: { type: array, items: { type: string } }
                        status: { type: string }

  /campaign_stops:
    get:
      operationId: getCampaignStops
      summary: Ordered list of city stops for a campaign, joined with city names.
      parameters:
        - name: campaign_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Campaign stops in sequence order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign_id: { type: string }
                  stops:
                    type: array
                    items:
                      type: object
                      properties:
                        city_id: { type: string }
                        city_name: { type: string }
                        stop_date: { type: string, format: date }
                        sequence_order: { type: integer }
                        event_format: { type: string, nullable: true }
    post:
      operationId: createCampaignStops
      summary: >
        Add city stops to a campaign. Used by the dashboard's "New Campaign"
        flow — not currently called by any Playbook. city_id is restricted to
        the cities with full seeded coverage (mumbai, london, tokyo,
        sao_paulo, new_york) since fan_signals has no live-search fallback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaign_id, stops]
              properties:
                campaign_id: { type: string }
                stops:
                  type: array
                  items:
                    type: object
                    required: [city_id]
                    properties:
                      city_id: { type: string }
                      stop_date: { type: string, format: date }
                      sequence_order: { type: integer }
                      event_format: { type: string, nullable: true }
      responses:
        "200":
          description: Insert confirmation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign_id: { type: string }
                  status: { type: string }
                  count: { type: integer }
        "400":
          description: Missing fields or an unsupported city_id.
        "500":
          description: Insert failed.

  /city_briefs:
    post:
      operationId: insertCityBrief
      summary: Persist a finalized city brief as a real BigQuery row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brief_id, campaign_id, city_id, status]
              properties:
                brief_id: { type: string }
                campaign_id: { type: string }
                city_id: { type: string }
                generated_at: { type: string, format: date-time }
                status: { type: string }
                enthusiasm_score: { type: number }
                culture_summary: { type: string }
                local_delight_summary: { type: string }
                talent_brief_json: { type: string }
                grounding_check_passed: { type: boolean }
                grounding_check_notes: { type: string }
                delight_card_url: { type: string }
      responses:
        "200":
          description: Insert confirmation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  brief_id: { type: string }
                  status: { type: string }
        "500":
          description: Insert failed.

  /score_enthusiasm:
    post:
      operationId: scoreEnthusiasm
      summary: Blend a curated base enthusiasm signal with an optional live-signal override.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_signal]
              properties:
                base_signal:
                  type: object
                  properties:
                    enthusiasm_score: { type: number }
                    fan_behavior_style: { type: string }
                    city_importance_tier: { type: string }
                    genre_affinity_notes: { type: string }
                    signal_basis: { type: string }
                live_signal_score: { type: number, nullable: true }
                live_signal_weight: { type: number }
      responses:
        "200":
          description: Final blended enthusiasm score and tier.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enthusiasm_score: { type: number }
                  city_importance_tier: { type: string }
                  fan_behavior_style: { type: string }
                  genre_affinity_notes: { type: string }
                  confidence_caveat: { type: string }
                  used_live_signal: { type: boolean }

  /rank_cities:
    post:
      operationId: rankCities
      summary: Rank a campaign's cities by strategic value (tier, then enthusiasm score) for the Compare Cities screen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city_records]
              properties:
                city_records:
                  type: array
                  items:
                    type: object
                    properties:
                      city_id: { type: string }
                      enthusiasm_score: { type: number }
                      city_importance_tier: { type: string }
      responses:
        "200":
          description: Ranked list with strategic_rank assigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ranked:
                    type: array
                    items:
                      type: object

  /check_grounding:
    post:
      operationId: checkGrounding
      summary: Deterministic keyword-overlap backstop checking a draft brief against a city's don't list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draft_brief_text, donts]
              properties:
                draft_brief_text: { type: string }
                donts: { type: array, items: { type: string } }
                humor_boundaries: { type: string, nullable: true }
      responses:
        "200":
          description: Grounding check result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  grounding_check_passed: { type: boolean }
                  grounding_check_notes: { type: string }
                  flags:
                    type: array
                    items: {}

  /synthesize_pronunciation:
    post:
      operationId: synthesizePronunciation
      summary: >
        Real Gemini-native-TTS pronunciation audio for a set of local
        phrases, uploaded to Cloud Storage. Content-hashed per phrase, so a
        repeat (a common greeting reused across cities/campaigns) resolves
        to the existing object instead of a redundant TTS call. Called
        directly from the orchestration driver after local_delight is
        gathered, not through a conversational playbook turn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phrases]
              properties:
                phrases: { type: array, items: { type: string } }
      responses:
        "200":
          description: One entry per requested phrase, in the same order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  audio:
                    type: array
                    items:
                      type: object
                      properties:
                        phrase: { type: string }
                        audio_url: { type: string, nullable: true }
                        error: { type: string, nullable: true }

  /generate_style_moodboard:
    post:
      operationId: generateStyleMoodboard
      summary: >
        Grounded local-style image generation: a real Gemini image-gen call
        producing an abstract style moodboard poster, prompted from real
        culture/local-delight signals for this city (palette, motifs, mood)
        -- never a generic stock aesthetic, and explicitly forbidden from
        depicting real people or readable text. Uploaded to Cloud Storage,
        content-hashed on (city_id, style_notes) so an unchanged style brief
        skips re-generation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city_id, city_name, style_notes]
              properties:
                city_id: { type: string }
                city_name: { type: string }
                style_notes: { type: string }
      responses:
        "200":
          description: The generated (or cached) moodboard image URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  city_id: { type: string }
                  moodboard_url: { type: string }

  /city_monitors:
    post:
      operationId: createCityMonitor
      summary: >
        Continuous grounding: creates (or returns the existing) real
        Parallel Monitor tracking cultural/news drift (or, with
        monitor_type=safety, safety/logistics drift) for one city stop --
        so a brief generated weeks before a tour date can be checked for
        what's changed since, which a one-shot generation can't do.
        Idempotent per campaign_id+city_id+monitor_type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaign_id, city_id, city_name]
              properties:
                campaign_id: { type: string }
                city_id: { type: string }
                city_name: { type: string }
                monitor_type: { type: string, enum: [cultural, safety], default: cultural }
      responses:
        "200":
          description: The monitor id, and whether it was just created or already existed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  monitor_id: { type: string }
                  created: { type: boolean }

  /trigger_city_monitor:
    post:
      operationId: triggerCityMonitor
      summary: >
        Forces an immediate check instead of waiting for the monitor's own
        daily cadence. Real observed latency: ~60-90s until a fresh result
        appears via getCityMonitorEvents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monitor_id]
              properties:
                monitor_id: { type: string }
      responses:
        "200":
          description: Trigger accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }

  /city_monitor_events:
    get:
      operationId: getCityMonitorEvents
      summary: Whatever drift Parallel has found for this monitor so far, most recent first.
      parameters:
        - name: monitor_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Real, cited findings (possibly empty if nothing has resolved yet).
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        event_date: { type: string, nullable: true }
                        summary: { type: string, nullable: true }
                        citations:
                          type: array
                          items:
                            type: object
                            properties:
                              url: { type: string }
                              title: { type: string }

  /genre_recommendations:
    get:
      operationId: getGenreRecommendations
      summary: >
        Cross-campaign learning: which cities have historically driven the
        highest real enthusiasm for a genre, aggregated from actual
        finalized city_briefs joined to their campaign's genre. Naturally
        sparse until more campaigns have run.
      parameters:
        - name: genre
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ranked recommendations, possibly empty if no historical data exists yet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  genre: { type: string }
                  recommendations:
                    type: array
                    items:
                      type: object
                      properties:
                        city_id: { type: string }
                        avg_enthusiasm_score: { type: number }
                        sample_size: { type: integer }

  /synthesize_campaign_insights:
    post:
      operationId: synthesizeCampaignInsights
      summary: >
        Cross-city pattern synthesis: given every stop's already-finalized
        brief data, finds non-obvious patterns a planner going city-by-city
        would miss -- a shared theme with different valence across stops, a
        sequencing risk, a real tension between two cities' guidance.
        Strictly grounded in the cities payload, never speculative beyond
        it. Called once from the orchestration driver after every stop in a
        campaign has a final brief -- does not write to BigQuery itself,
        see /campaign_insights for that.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaign_id, cities]
              properties:
                campaign_id: { type: string }
                cities:
                  type: array
                  items:
                    type: object
                    properties:
                      city_id: { type: string }
                      city_name: { type: string }
                      culture_summary: { type: string, nullable: true }
                      local_delight_summary: { type: string, nullable: true }
                      talent_brief_json: { type: string, nullable: true }
      responses:
        "200":
          description: Cross-city insights found (possibly empty).
          content:
            application/json:
              schema:
                type: object
                properties:
                  insights:
                    type: array
                    items:
                      type: object
                      properties:
                        title: { type: string }
                        summary: { type: string }
                        severity: { type: string, enum: [info, advisory, risk] }
                        affected_cities: { type: array, items: { type: string } }

  /campaign_insights:
    get:
      operationId: getCampaignInsights
      summary: The latest cross-city insights synthesis for a campaign, if one has been run.
      parameters:
        - name: campaign_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Latest insights row, or nulls if none generated yet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign_id: { type: string }
                  generated_at: { type: string, nullable: true }
                  insights_json: { type: string, nullable: true }
    post:
      operationId: insertCampaignInsights
      summary: Persists one cross-city insights synthesis result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaign_id]
              properties:
                campaign_id: { type: string }
                generated_at: { type: string, nullable: true }
                insights_json: { type: string, nullable: true }
      responses:
        "200":
          description: Insert confirmation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign_id: { type: string }
                  status: { type: string }

  /synthesize_stop_outcome:
    post:
      operationId: synthesizeStopOutcome
      summary: >
        Post-tour retrospective: a real live search for actual press/fan
        reaction after a stop's date has passed -- distinct from
        city_briefs.enthusiasm_score, which is only ever a pre-show
        prediction. Does not write to BigQuery itself; see
        /stop_outcomes for that.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaign_id, city_id, city_name, campaign_title, stop_date]
              properties:
                campaign_id: { type: string }
                city_id: { type: string }
                city_name: { type: string }
                campaign_title: { type: string }
                stop_date: { type: string }
      responses:
        "200":
          description: Grounded outcome (possibly low-confidence if no results found).
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: string }
                  outcome_summary: { type: string, nullable: true }
                  sentiment: { type: string, enum: [positive, mixed, negative, unknown] }
                  confidence: { type: string, enum: [high, medium, low] }
                  citations:
                    type: array
                    items:
                      type: object
                      properties:
                        url: { type: string }
                        title: { type: string }

  /stop_outcomes:
    get:
      operationId: getStopOutcome
      summary: The latest persisted post-tour outcome for one campaign/city stop, if one has been synthesized.
      parameters:
        - name: campaign_id
          in: query
          required: true
          schema:
            type: string
        - name: city_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Latest outcome row, or a null outcome_json if none generated yet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign_id: { type: string }
                  city_id: { type: string }
                  generated_at: { type: string, nullable: true }
                  outcome_json: { type: string, nullable: true }
    post:
      operationId: insertStopOutcome
      summary: Persists one post-tour outcome synthesis result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaign_id, city_id]
              properties:
                campaign_id: { type: string }
                city_id: { type: string }
                generated_at: { type: string, nullable: true }
                outcome_json: { type: string, nullable: true }
      responses:
        "200":
          description: Insert confirmation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign_id: { type: string }
                  city_id: { type: string }
                  status: { type: string }
